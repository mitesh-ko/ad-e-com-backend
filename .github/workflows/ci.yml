name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-and-test:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Production Build
        run: npm run build

      - name: Run Test Suite
        run: npm run test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: github_actions_ci_secret_key_access_32bytes
          JWT_REFRESH_SECRET: github_actions_ci_secret_key_refresh_32bytes
          MONGO_URI: mongodb://localhost:27017/ad_e_com_test
          REDIS_ENABLED: false
