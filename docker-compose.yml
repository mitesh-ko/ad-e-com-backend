version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ad_e_com_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - TZ=UTC
      - PORT=4000
      - HOST=0.0.0.0

      - MONGO_URI=mongodb://mongo:27017/ad_e_com
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=enterprise_production_access_secret_key_32bytes_long
      - JWT_REFRESH_SECRET=enterprise_production_refresh_secret_key_32bytes_long
      - CORS_ORIGIN=["http://localhost:3000","http://localhost:5173"]
      - LOG_LEVEL=info
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  mongo:
    image: mongo:7.0
    container_name: ad_e_com_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: ad_e_com_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
  redis_data:

networks:
  app_network:
    driver: bridge
